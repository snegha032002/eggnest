<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | EggNest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
<section class="page-top">
  <div class="wrap"><div class="crumbs"><a href="index.html">Home</a> / Contact</div><h1>Let's <em>Talk</em> Eggs</h1><p>Questions, feedback or a bulk order: we usually reply within a few hours.</p></div>
  <svg class="wave" viewBox="0 0 1440 50" preserveAspectRatio="none" aria-hidden="true"><path d="M0 50V28c180-26 380-30 600-10s480 22 840-8v40z" fill="currentColor"/></svg>
</section>
<section style="padding-top:40px">
  <div class="wrap contact-wrap">
    <div class="contact-card reveal">
      <h2>Get in touch</h2>
      <div class="row"><i>☎</i><div><small>Call or WhatsApp</small><span data-site="phone"></span></div></div>
      <div class="row"><i>✉</i><div><small>Email</small><span data-site="email"></span></div></div>
      <div class="row"><i>◷</i><div><small>Hours</small><span data-site="hours"></span></div></div>
      <div class="row"><i>⌂</i><div><small>Address</small><span data-site="address"></span></div></div>
      <span class="script">Goodness in Every Egg ♡</span>
    </div>
    <div class="form-box reveal">
      <h2>Send us a message</h2>
      <form class="form">
        <div class="pair"><label for="c-name">Name<input id="c-name" required placeholder="Your name"></label><label for="c-phone">Phone<input id="c-phone" type="tel" placeholder="Mobile number"></label></div>
        <label for="c-email">Email<input id="c-email" type="email" required placeholder="you@example.com"></label>
        <label for="c-topic">Topic<select id="c-topic"><option>Order or delivery</option><option>Bulk / wholesale order</option><option>Feedback</option><option>Something else</option></select></label>
        <label for="c-msg">Message<textarea id="c-msg" required placeholder="How can we help?"></textarea></label>
        <button class="btn btn-dark" style="justify-content:center">Send Message <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7.5h11M9 3.5l4 4-4 4"/></svg></button>
        <div class="done">✓ Message received. We'll reply soon.</div>
      </form>
    </div>
  </div>
</section>
<script src="js/main.js"></script>
</body>
</html>
